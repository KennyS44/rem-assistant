name: Сборка для Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Тесты
        run: python -m pytest tests -q

      - name: Самопроверка (исходники)
        run: python -m rem --selftest

      - name: Сборка Rem.exe
        run: pyinstaller packaging/rem.spec --noconfirm --distpath dist --workpath build

      - name: Самопроверка собранного Rem.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Rem\Rem.exe -ArgumentList "--selftest","--report","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Самопроверка Rem.exe не прошла (код $($p.ExitCode))" }

      - name: Установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (python -c "import rem; print(rem.__version__)")
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершился с ошибкой" }
          Get-Item Output\RemSetup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: RemSetup
          path: Output/RemSetup.exe

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/RemSetup.exe
          generate_release_notes: true
