name: Сборка для Windows

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Тесты
        run: python -m pytest tests -q

      - name: Самопроверка (исходники)
        run: python -m rem --selftest

      - name: Сборка Rem.exe
        run: pyinstaller packaging/rem.spec --noconfirm --distpath dist --workpath build

      - name: Самопроверка собранного Rem.exe
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath dist\Rem\Rem.exe -ArgumentList "--selftest","--report","selftest.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "Rem.exe не ответил за 2 минуты" }
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          $crash = Join-Path $env:APPDATA "Rem\crash.txt"
          if (Test-Path $crash) { Write-Host "=== crash.txt ==="; Get-Content $crash }
          if ($p.ExitCode -ne 0) { throw "Самопроверка Rem.exe не прошла (код $($p.ExitCode))" }

      - name: Кэш моделей речи
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Rem\models
          key: speech-models-vosk022-gigaam3int8

      - name: Распознавание речи в собранном Rem.exe
        shell: pwsh
        timeout-minutes: 10
        run: |
          $args = @("--speech-test", "tests\data\wake_command.wav", "tests\data\decoy.wav", "--report", "speech.txt")
          $p = Start-Process -FilePath dist\Rem\Rem.exe -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(480000)) { $p.Kill(); Write-Host "Rem.exe не ответил за 8 минут" }
          if (Test-Path speech.txt) { Get-Content speech.txt }
          $crash = Join-Path $env:APPDATA "Rem\crash.txt"
          if (Test-Path $crash) { Write-Host "=== crash.txt ==="; Get-Content $crash }
          if ($p.ExitCode -ne 0) { throw "Распознавание в Rem.exe не прошло (код $($p.ExitCode))" }

      - name: Кэш нейроголоса
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\Rem\voice
          key: voice-1-silero-v5

      - name: Нейроголос в собранном Rem.exe
        shell: pwsh
        timeout-minutes: 15
        run: |
          # скачивает голос по тем же адресам, что кнопка в настройках (релиз voice-1 и сайт Silero)
          $p = Start-Process -FilePath dist\Rem\Rem.exe -ArgumentList "--voice-test","--report","voice.txt" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Host "Rem.exe не ответил за 10 минут" }
          if (Test-Path voice.txt) { Get-Content voice.txt }
          $crash = Join-Path $env:APPDATA "Rem\crash.txt"
          if (Test-Path $crash) { Write-Host "=== crash.txt ==="; Get-Content $crash }
          if ($p.ExitCode -ne 0) { throw "Нейроголос в Rem.exe не работает (код $($p.ExitCode))" }

      - name: Установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (python -c "import rem; print(rem.__version__)")
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершился с ошибкой" }
          Get-Item Output\RemSetup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: RemSetup
          path: Output/RemSetup.exe

  install-cycle:
    # Чистая Windows: установка вместе с Ollama → удаление → повторная установка →
    # полное удаление. После каждого шага ищем оставшиеся следы.
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Установщик из этой сборки
        uses: actions/download-artifact@v4
        with:
          name: RemSetup

      - name: Установка вместе с Ollama
        timeout-minutes: 15
        run: |
          . .\.github\scripts\checks.ps1
          $p = Start-Process .\RemSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=autostart,ollama' -PassThru
          $p.WaitForExit()
          Expect (Test-Path "$App\Rem.exe")                         "Rem.exe установлен"
          Expect (Test-Path "$App\unins000.exe")                    "деинсталлятор на месте"
          Expect (Test-Path $StartMenu)                             "ярлык в меню «Пуск»"
          Expect ($null -ne (RunValue))                             "автозапуск записан"
          Expect (Test-Path $OllamaExe)                             "Ollama установлена установщиком Рэм"
          Expect ((Get-ItemProperty HKCU:\Software\Rem -ErrorAction SilentlyContinue).InstalledOllama -eq '1') "отметка «Ollama ставили мы»"
          Finish

      - name: Рэм сам запускает Ollama, если она остановлена
        timeout-minutes: 5
        run: |
          . .\.github\scripts\checks.ps1
          Stop-Process -Name "ollama app", ollama -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          Expect (-not (Get-Process -Name ollama -ErrorAction SilentlyContinue)) "Ollama остановлена"
          $p = Start-Process "$App\Rem.exe" -ArgumentList '--check-ollama','--report','ollama.txt' -PassThru
          $p.WaitForExit(60000) | Out-Null
          if (Test-Path ollama.txt) { Get-Content ollama.txt }
          Expect ($p.ExitCode -eq 0) "Rem.exe запустил Ollama"
          $v = Invoke-RestMethod http://127.0.0.1:11434/api/version -TimeoutSec 5 -ErrorAction SilentlyContinue
          Expect ($null -ne $v) "Ollama отвечает (версия $($v.version))"
          Finish

      - name: Подготовка — модель, настройки, мусор после работы
        timeout-minutes: 10
        run: |
          . .\.github\scripts\checks.ps1
          Start-Process $OllamaExe -ArgumentList 'serve' -WindowStyle Hidden
          Start-Sleep 5
          & $OllamaExe pull smollm:135m
          New-Item -ItemType Directory -Force "$env:APPDATA\Rem\models" | Out-Null
          '{"wake_word": "рэм", "model": "smollm:135m"}' | Set-Content "$env:APPDATA\Rem\config.json" -Encoding utf8
          'x' | Set-Content "$env:APPDATA\Rem\models\fake.onnx"
          New-Item -ItemType Directory -Force "$App\_internal\comtypes\gen" | Out-Null
          'x' | Set-Content "$App\_internal\comtypes\gen\_leftover.py"   # как кэш comtypes после работы
          Expect (((& $OllamaExe list) -join ' ') -match 'smollm') "модель скачана в Ollama"
          Finish

      - name: Обновление поверх работающего Рэм
        timeout-minutes: 10
        run: |
          . .\.github\scripts\checks.ps1
          # человек выключил автозапуск в настройках — обновление не должно включить его обратно
          Remove-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Rem -ErrorAction SilentlyContinue
          $old = Start-Process "$App\Rem.exe" -PassThru
          Start-Sleep 5
          Expect (-not $old.HasExited) "Рэм запущен перед обновлением"
          # те же параметры, что передаёт rem/update.py
          $p = Start-Process .\RemSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/FORCECLOSEAPPLICATIONS','/MERGETASKS=!autostart,!desktopicon,!ollama','/UPDATE=1' -PassThru
          $p.WaitForExit()
          Expect ($p.ExitCode -eq 0) "установщик обновления завершился без ошибок (код $($p.ExitCode))"
          Start-Sleep 5
          Expect ($old.HasExited) "старый Рэм закрыт"
          $new = Get-Process -Name Rem -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $old.Id }
          Expect ($null -ne $new) "новый Рэм запущен после обновления"
          Expect (Test-Path "$App\Rem.exe") "Rem.exe на месте"
          Expect ((Get-Content "$env:APPDATA\Rem\config.json" -Raw) -match 'smollm') "настройки сохранились"
          Expect (Test-Path "$env:APPDATA\Rem\models\fake.onnx") "модели речи сохранились"
          Expect ($null -eq (RunValue)) "автозапуск не включился сам"
          Expect (-not (Test-Path "$env:USERPROFILE\Desktop\Рэм.lnk")) "ярлык на рабочем столе не появился"
          Stop-Process -Name Rem -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          Finish

      - name: Удаление с сохранением Ollama
        timeout-minutes: 10
        run: |
          . .\.github\scripts\checks.ps1
          Start-Process "$App\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/KEEPOLLAMA=1'
          WaitGone "$App\Rem.exe" 180
          Start-Sleep 5
          Expect (-not (Test-Path $App))                            "папка программы удалена целиком"
          Expect (-not (Test-Path $StartMenu))                      "ярлык удалён"
          Expect ($null -eq (RunValue))                             "автозапуск удалён"
          Expect (-not (Test-Path "$env:APPDATA\Rem"))              "настройки и модели речи удалены"
          Expect (-not (Test-Path HKCU:\Software\Rem))              "ключ реестра Rem удалён"
          Expect (Test-Path $OllamaExe)                             "Ollama оставлена"
          Start-Process $OllamaExe -ArgumentList 'serve' -WindowStyle Hidden
          Start-Sleep 5
          Expect (-not (((& $OllamaExe list) -join ' ') -match 'smollm'))       "модель Рэм удалена из Ollama"
          Finish

      - name: Повторная установка и полное удаление
        timeout-minutes: 15
        run: |
          . .\.github\scripts\checks.ps1
          $p = Start-Process .\RemSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=autostart' -PassThru
          $p.WaitForExit()
          Expect (Test-Path "$App\Rem.exe") "Rem.exe установлен повторно"
          Start-Process "$App\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/REMOVEOLLAMA=1'
          WaitGone "$App\Rem.exe" 180
          WaitGone $OllamaExe 180
          Start-Sleep 5
          Expect (-not (Test-Path $App))                            "папка программы удалена"
          Expect ($null -eq (RunValue))                             "автозапуск удалён"
          Expect (-not (Test-Path $OllamaExe))                      "Ollama удалена"
          Expect (-not (Test-Path "$env:USERPROFILE\.ollama"))      "модели Ollama удалены"
          Expect (-not (Get-Process -Name ollama -ErrorAction SilentlyContinue)) "процессы Ollama остановлены"
          Finish

  release:
    # Релиз публикуется, только если установка и удаление прошли проверку.
    needs: [windows, install-cycle]
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/voice-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RemSetup
      - uses: softprops/action-gh-release@v2
        with:
          files: RemSetup.exe
          generate_release_notes: true
