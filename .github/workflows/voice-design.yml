name: Голос Рем по описанию

# Запуск вручную. samples — образцы вариантов описания; pack — готовые фразы выбранным голосом.
# Результат — архив в артефактах запуска; клипы кладутся в rem/clips отдельным коммитом.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "samples, round2 или pack"
        default: samples
      variant:
        description: "вариант описания (a–d), для pack"
        default: a
      seed:
        description: "номер образца (1 или 2), для pack"
        default: "1"
      engine:
        description: "qwen (Qwen3-TTS) или vox (VoxCPM2), для samples"
        default: qwen
      only:
        description: "для pack: переозвучить только эту фразу; «новые» — только фразы без записи; пусто — все"
        default: ""

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Зависимости
        run: |
          # sox нужен только для предупреждений qwen-tts; сбой зеркала Ubuntu не должен ронять запись
          sudo apt-get update -qq || true
          sudo apt-get install -y sox libsox-fmt-all > /dev/null || echo "sox не установился — продолжаю без него"
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install soundfile numpy
          if [ "${{ inputs.engine }}" = vox ]; then pip install voxcpm; else pip install qwen-tts ruaccent onnx-asr onnxruntime rapidfuzz; fi
      - name: Озвучка
        env:
          ONLY: ${{ inputs.only }}
        run: |
          extra=()
          if [ "$ONLY" = "новые" ]; then extra=(--missing)
          elif [ -n "$ONLY" ]; then extra=(--only "$ONLY" --candidates 8); fi
          python voice/design.py ${{ inputs.mode }} out --variant ${{ inputs.variant }} --seed ${{ inputs.seed }} --engine ${{ inputs.engine }} "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: rem-voice-${{ inputs.mode }}-${{ inputs.engine }}
          path: out
